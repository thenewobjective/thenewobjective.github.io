<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="A binary tree with the cursor on node b, and the same cursor shown as a zipper: one path step holding the direction, the parent value, and the sibling subtree, followed by the focus with its two subtrees.">
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .t-title { font-size: 13px; fill: #0f172a; font-weight: 600; }
    .t-label { font-size: 12px; fill: #64748b; text-anchor: middle; }
    .t-field { font-size: 11px; fill: #64748b; }
    .t-val { font-size: 14px; fill: #0f172a; text-anchor: middle; }
    .t-step { font-size: 13px; fill: #0f172a; text-anchor: middle; }
    .node { fill: #ffffff; stroke: #475569; stroke-width: 1.4; }
    .focus { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.8; }
    .kept { fill: #fef3c7; stroke: #b45309; stroke-width: 1.4; }
    .box-step { fill: #fffbeb; stroke: #b45309; stroke-width: 1.6; }
    .box-focus { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.6; }
    .edge { fill: none; stroke: #475569; stroke-width: 1.2; }
    .path { fill: none; stroke: #b45309; stroke-width: 2.2; }
    .conn { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .t-path { font-size: 11px; fill: #b45309; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ===== the cursor in a tree ===== -->
  <text x="16" y="24" class="t-title">the cursor in a tree</text>

  <!-- plain edges -->
  <path d="M 197 74 L 253 118" class="edge"/>
  <path d="M 113 144 L 90 188" class="edge"/>
  <path d="M 127 144 L 148 188" class="edge"/>
  <path d="M 252 144 L 232 188" class="edge"/>
  <path d="M 268 144 L 288 188" class="edge"/>

  <!-- path from root to cursor -->
  <path d="M 183 74 L 127 118" class="path"/>
  <text x="146" y="90" class="t-path">path</text>

  <!-- nodes -->
  <rect x="175" y="48" width="30" height="26" rx="5" class="node"/>
  <text x="190" y="66" class="t-val">r</text>
  <rect x="105" y="118" width="30" height="26" rx="5" class="focus"/>
  <text x="120" y="136" class="t-val">b</text>
  <rect x="245" y="118" width="30" height="26" rx="5" class="kept"/>
  <text x="260" y="136" class="t-val">d</text>
  <rect x="70" y="188" width="30" height="26" rx="5" class="node"/>
  <text x="85" y="206" class="t-val">a</text>
  <rect x="140" y="188" width="30" height="26" rx="5" class="node"/>
  <text x="155" y="206" class="t-val">c</text>
  <rect x="210" y="188" width="30" height="26" rx="5" class="kept"/>
  <text x="225" y="206" class="t-val">e</text>
  <rect x="280" y="188" width="30" height="26" rx="5" class="kept"/>
  <text x="295" y="206" class="t-val">f</text>

  <text x="120" y="236" class="t-label">focus</text>
  <text x="260" y="236" class="t-label">sibling subtree</text>

  <!-- ===== the same cursor as a zipper ===== -->
  <text x="390" y="24" class="t-title">the same cursor as a zipper</text>

  <!-- step box -->
  <rect x="400" y="118" width="150" height="56" rx="6" class="box-step"/>
  <text x="475" y="140" class="t-step">fromLeft</text>
  <text x="475" y="160" class="t-step">value: r</text>

  <!-- arrow to focus box -->
  <path d="M 554 146 L 586 146" class="path" marker-end="url(#ah3)"/>

  <!-- focus box -->
  <rect x="592" y="118" width="140" height="56" rx="6" class="box-focus"/>
  <text x="662" y="150" class="t-step">focus: b</text>

  <!-- step's sibling subtree (the right field) -->
  <path d="M 475 174 L 475 206" class="conn"/>
  <text x="483" y="194" class="t-field">right</text>
  <rect x="460" y="206" width="30" height="26" rx="5" class="kept"/>
  <text x="475" y="224" class="t-val">d</text>
  <path d="M 467 232 L 447 262" class="edge"/>
  <path d="M 483 232 L 503 262" class="edge"/>
  <rect x="425" y="262" width="30" height="26" rx="5" class="kept"/>
  <text x="440" y="280" class="t-val">e</text>
  <rect x="495" y="262" width="30" height="26" rx="5" class="kept"/>
  <text x="510" y="280" class="t-val">f</text>

  <!-- focus's subtrees (the left and right fields) -->
  <path d="M 645 174 L 630 206" class="conn"/>
  <text x="622" y="194" class="t-field" text-anchor="end">left</text>
  <path d="M 679 174 L 694 206" class="conn"/>
  <text x="702" y="194" class="t-field">right</text>
  <rect x="613" y="206" width="30" height="26" rx="5" class="node"/>
  <text x="628" y="224" class="t-val">a</text>
  <rect x="681" y="206" width="30" height="26" rx="5" class="node"/>
  <text x="696" y="224" class="t-val">c</text>

  <text x="475" y="316" class="t-label">path</text>
  <text x="662" y="316" class="t-label">the cursor and its subtrees</text>
</svg>
